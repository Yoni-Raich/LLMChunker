[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-split"
version = "1.0.0"
authors = [
  { name="Yoni Raich" },
]
description = "A Python library for intelligent, semantic chunking of large documents using LLMs."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic",
    "langchain-core",
    "langchain-text-splitters"
]

[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "mock",
]
